name: Smart Irrigation v4
on:
  push:
    paths: ['rebuild/**', '.github/workflows/irrigation-v4.yml']
  pull_request:
    paths: ['rebuild/**', '.github/workflows/irrigation-v4.yml']
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m compileall -q rebuild/firmware rebuild/tools
      - run: python -m unittest discover -s rebuild/tests -v
      - run: python rebuild/tools/simulate.py
      - run: python rebuild/tools/make_bundle.py
